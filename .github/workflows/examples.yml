name: Offline examples
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/verify_release.py
      - run: python examples/carbon_calculator.py
      - run: python examples/application_check.py
      - run: python examples/housing_summary.py
